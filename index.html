<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>FZ EZ Video Downloader</title>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="sup" style="text-align:center">

      <!-- HEADEDR INFO -->

      <h1 style="margin-top: 30px;margin-bottom: 18px;">FZ EZ Video Downloader</h1>

      <a href="https://ytdl-org.github.io/youtube-dl/supportedsites.html" target="_blank"><p>List of Sites Supported</p></a>


      <button type="update" class="btn btn-primary btn-sm" style="margin-top:7px;margin-bottom:32px;">Press me if Broken</button>
      <br>
      <br>

      <!-- DOWNLOAD VIDEO SECTION -->

      <h2 style="margin-bottom:16px;">Download A Video</h2>

      <label style="font-size:22px;margin-bottom: 0;" for="">第一步：Video URL (网址)</label>
      <br>

      <!-- input to paste in youtube url-->
      <input type="text" class="youtubeUrl" value="" placeholder="www.youtube.com/..." style="width:450px;text-align:center;font-size:17px;width:100%;">

      <br>

      <!--paste button  COMMENT THIS OUT FOR OTHER PEOPLE USE-->
      <button type="button" onclick="myFunction()" class="btn btn-primary btn-sm" style="margin-top:7px;margin-bottom:32px;">Paste</button>
      <!-- <button type="button" class="btn btn-primary btn-sm" style="margin-top:7px;margin-bottom:32px;">Paste</button> -->

      <br>
      <div class="titleDiv" style="height:20px">
        <label style="font-size:22px;margin-bottom: 0;" for="">第二步： Song/Video name (歌曲）</label>
        <input type="text" class="saveAsTitle" id="saveAsTitle" value="" style="text-align:center;width:100%;margin-bottom:9px;font-size:17px;" placeholder="i.e: Let me go home">
      </div>

      <!-- </div class="artistDiv" style="height:20"> -->
        <label style="font-size:22px;margin-bottom: 0;margin-top: 100px; text-align: center;" for="">第三步<b>(optional)</b>：Artist/Author (歌手)</label>
        <input type="text" class="artist" id="artist" value="" style="text-align:center;width:100%;margin-bottom:9px;font-size:17px;" placeholder="i.e.: Michael Bublé">
      <!-- <div> -->


      <div class="playlistDownloadingDiv" style="height:10px;display:none;margin-bottom:-30px;">
        <h4 class="downloadPlaylistText" style="font-size:22px"># Item Playlist or Channel To Be Downloaded`</h4>
      </div>

      <br>

      <br>

       <!--SELECT DIRECTORY SECTION-->

      <br>
      <label for="" style="font-size:22px">Directory</label>

      <input type="text" class="selectVideoDirectoryInput" value=""  style="text-align:center;width:100%;margin-bottom:9px;font-size:17px;">

      <button type="button" class="btn btn-primary btn-sm selectVideoDirectory" style="margin-top:7px;margin-bottom:32px;">Select Directory</button>

      <br>
      <form name=f1>
      <label for="" style="margin-right: 7px;margin-top:5px;"><b>Download ONLY As Audio</b></Download></label>
      <input type="checkbox" class="downloadAsAudio" id="dlAsAudio" onclick="audioCheck(this.checked)">
      <br>
      <label for="" style="margin-right: 7px;margin-top:5px;"><b>Save to iTunes (Must first check "Download as Audio")</b></label>
      <input type="checkbox" class="saveToiTunes" id="saveToiTunes" disabled="">
      </form>
      <br>
      <button class="startDownload btn btn-success" style="height: 90px;width: 350px;font-size: 30px;margin-top:20px;" onclick="move()">Start Download (下载）</button>
      <br>
      <br>

      <div id="myProgress">
        <div id="myBar">0%</div>
      </div>

      <h5 class="percentage" style="height:52px;overflow:hidden;margin-top: 23px;margin-bottom: 15px;font-size:22px;">Status: Download Hasn't Started Yet (下载还没开始...)</h5>



      <button class="openFolder btn btn-info btn-sm">Open Videos Folder</button>
      <br>
      <br>
      <br>
    </div>

    <script src="./renderer.js"></script>
    <script src="./util.js"></script>
  </body>
    <script>
//      var selectVideoDirectoryInput = document.getElementsByClassName('selectVideoDirectoryInput')[0];
//      selectVideoDirectoryInput.value = './videos';
    </script>
</html>
